<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gezinsplanner</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F4F6F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1824" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gezinsplanner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Agenda, taken, lijsten en weekmenu voor het hele gezin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F9;--card:#fff;--ink:#14263B;--mute:#5F6F82;--line:#E1E6EE;--acc:#14263B;--onacc:#fff;--hi:#FFD23F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1824;--card:#172435;--ink:#EEF2F7;--mute:#9AA9BB;--line:#263548;--acc:#FFD23F;--onacc:#14263B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1824;--card:#172435;--ink:#EEF2F7;--mute:#9AA9BB;--line:#263548;--acc:#FFD23F;--onacc:#14263B;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;padding-bottom:84px;max-width:640px;margin-inline:auto}
h1,h2{font-family:"Bricolage Grotesque",Figtree,sans-serif;margin:0}
h1{font-size:2rem;font-weight:800;line-height:1.1;letter-spacing:-.02em}
h2{font-size:1.1rem;font-weight:600;margin-bottom:8px}
main{padding:0 16px 16px}
.top{padding:20px 0 4px}
.sub{color:var(--mute);margin:4px 0 0;text-transform:capitalize}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.grow{flex:1;min-width:0}
.time{width:56px;color:var(--mute);font-size:.9rem;font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.dots{margin-top:2px}
.mute{color:var(--mute)}
.empty{color:var(--mute);padding:6px 0}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.x{border:0;background:none;color:var(--mute);font-size:1.4rem;cursor:pointer;padding:4px 8px}
.ck{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--mute);background:none;cursor:pointer;position:relative}
.ck.on{background:var(--acc);border-color:var(--acc)}
.ck.on::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid var(--onacc);border-width:0 3px 3px 0;transform:rotate(40deg)}
.done{text-decoration:line-through;color:var(--mute)}
.pts{background:var(--hi);color:#14263B;border-radius:8px;padding:2px 8px;font-weight:700;font-size:.85rem}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.form{display:grid;gap:10px;margin-top:12px}
.inline{display:flex;gap:8px}
.clr{width:48px;height:44px;padding:3px;flex:none;cursor:pointer}
.tt{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.bellb{position:relative;flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer}
.badge{position:absolute;top:-6px;right:-6px;background:var(--hi);color:#14263B;border-radius:99px;font-size:.75rem;min-width:20px;padding:0 5px;line-height:20px;text-align:center}
.new{border-left:4px solid var(--hi);padding-left:10px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:var(--bg);border-radius:14px;padding:12px;color:var(--mute);font-size:.9rem}
.st b{display:block;color:var(--ink);font:800 1.7rem "Bricolage Grotesque",sans-serif}
.big{font:800 3rem/1 "Bricolage Grotesque",sans-serif}
.chart{display:flex;align-items:flex-end;gap:8px;height:112px}
.chart>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.chart i{display:block;width:100%;min-height:3px;border-radius:8px 8px 3px 3px}
.chart small{color:var(--mute);font-size:.72rem}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pal button{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px;cursor:pointer;text-align:left;font-weight:600}
.pal button.on{border-color:var(--acc)}
.sw{width:22px;height:22px;border-radius:50%;flex:none}
.hc{position:relative}
.hc>h2{padding-right:34px}
.hc>.chip{padding-right:44px}
.hq{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--mute);background:none;color:var(--mute);font:700 .8rem/1 Figtree,system-ui,sans-serif;cursor:pointer;display:grid;place-items:center;padding:0}
.hq::after{content:"";position:absolute;inset:-10px}
.hq[aria-expanded="true"]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.hint{background:var(--bg);border-left:4px solid var(--hi);border-radius:12px;padding:10px 12px;margin:6px 0 10px;font-size:.92rem}
.av{display:inline-grid;place-items:center;border-radius:50%;flex:none;line-height:1;color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.35);vertical-align:middle}
button.avb{position:relative;border:0;background:none;padding:0;cursor:pointer;flex:none}
.avb .ed{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--onacc);font-size:.7rem;display:grid;place-items:center;border:2px solid var(--card)}
.avg{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.avg button{border:2px solid var(--line);background:var(--bg);border-radius:14px;font-size:1.7rem;padding:6px 0;cursor:pointer;line-height:1.2}
.avg button.on{border-color:var(--acc);background:var(--card)}
.bgs{display:flex;gap:10px;flex-wrap:wrap;padding:3px}
.bgs button{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.bgs button.on{box-shadow:0 0 0 3px var(--acc)}
.bdg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{background:var(--bg);border-radius:14px;padding:10px 4px;text-align:center;font-size:.8rem;line-height:1.2;font-weight:600;color:var(--mute)}
.bd b{display:block;font-size:1.9rem;line-height:1.15;margin-bottom:2px}
.bd small{display:block;font-weight:400;font-size:.7rem;margin-top:2px}
.bd.on{color:var(--ink);box-shadow:inset 0 0 0 2px var(--hi)}
.bd.off b{filter:grayscale(1);opacity:.3}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:10px 0 6px}
.pod>div{flex:1;text-align:center;font-size:.85rem;font-weight:600;min-width:0}
.pod .blk{border-radius:10px 10px 4px 4px;margin-top:6px;display:grid;place-items:center;font:800 1.15rem "Bricolage Grotesque",sans-serif;color:#14263B}
.tg{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 0 2px}
.lnk{color:var(--ink);font-weight:600;font-size:.85rem;margin-right:12px;text-decoration:underline}
.week{display:grid;grid-template-columns:auto repeat(7,1fr) auto;gap:4px;align-items:center}
.wd{border:0;background:none;border-radius:14px;padding:8px 0;text-align:center;cursor:pointer;line-height:1.2}
.wd small{display:block;color:var(--mute);text-transform:capitalize}
.wd b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem}
.wd.on{background:var(--acc);color:var(--onacc)}
.wd.on small{color:var(--onacc)}
.wd .pip{display:block;height:5px;width:5px;border-radius:50%;margin:2px auto 0;background:var(--hi)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.lb{display:grid;grid-template-columns:64px 1fr 34px;gap:10px;align-items:center;margin:8px 0}
.meal{padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .inline{margin-top:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:640px}
nav button{flex:1;border:0;background:none;padding:12px 0;font-weight:600;font-size:.78rem;color:var(--mute);cursor:pointer;border-radius:12px}
#call{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;gap:12px;background:rgba(10,18,28,.94);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#call.on{display:flex}
#call video{width:100%;flex:1;min-height:0;border-radius:16px;background:#000;object-fit:cover}
#call #lv{flex:none;width:96px;height:128px;align-self:flex-end}
nav button.on{color:var(--ink);box-shadow:inset 0 -3px 0 var(--hi)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--onacc);padding:10px 16px;border-radius:12px;font-weight:600;display:none}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.ck{transition:background .15s,transform .1s}.btn:active,.ck:active{transform:scale(.94)}}
</style>
</head>
<body>
<main id="app"></main>
<nav><div id="nav"></div></nav>
<div id="toast" role="status"></div>
<div id="call"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const D=s=>new Date(s+"T12:00");
const today=new Date();today.setHours(12,0,0,0);
const T=iso(today);
const M0=[{id:"m",n:"Mama",c:"#E4572E"},{id:"p",n:"Papa",c:"#2E86AB"},{id:"s",n:"Sam",c:"#3E9B4F"},{id:"o",n:"Noor",c:"#9B5DE5"}];
let M=M0;
const mem=id=>M.find(m=>m.id===id)||{n:"Onbekend",c:"#888888"};
const seed=()=>({
 ev:[{id:1,t:"Zwemles Sam",d:T,h:"16:30",w:["s","p"]},{id:2,t:"Ouderavond",d:iso(add(today,1)),h:"19:30",w:["m","p"]},{id:3,t:"Tandarts Noor",d:iso(add(today,2)),h:"09:15",w:["o","m"]},{id:4,t:"Verjaardag oma",d:iso(add(today,4)),h:"14:00",w:["m","p","s","o"]}],
 li:{Boodschappen:[{t:"Melk",x:0},{t:"Brood",x:0},{t:"Appels",x:1}],Klusjes:[{t:"Lamp ophangen",x:0}]},
 ch:[{id:1,t:"Vaatwasser uitruimen",w:"s",p:2,x:0},{id:2,t:"Kamer opruimen",w:"o",p:3,x:0},{id:3,t:"Afval buiten zetten",w:"p",p:1,x:0},{id:4,t:"Was opvouwen",w:"m",p:2,x:1}],
 me:{[T]:{n:"Pasta pesto",g:"pasta, pesto, parmezaan"}}
});
let S;try{S=JSON.parse(localStorage.getItem("gp1"))}catch(e){}
if(!S)S=seed();
M=S.mb=S.mb||M0.map(m=>({...m}));
S.nt=S.nt||[];
if(!S.lg)S.lg=S.ch.filter(c=>c.x).map(c=>({id:'c'+c.id,c:c.id,w:c.w,p:c.p,t:c.t,ts:Date.now()}));
S.ct=S.ct||[];S.wl=S.wl||[];
const ST0=[{id:'s1',t:'Vaatwasser uitruimen',p:2},{id:'s2',t:'Kamer opruimen',p:3},{id:'s3',t:'Afval buiten zetten',p:1},{id:'s4',t:'Tafel dekken',p:1},{id:'s5',t:'Was opvouwen',p:2}];
S.st=S.st||ST0.map(x=>({...x}));
const ROL={b:'Beheerder',o:'Ouder',k:'Kind',a:'Gast: agenda',v:'Gast: kijken'};
const fixR=()=>M.forEach((m,i)=>{if(!m.r)m.r=i<2?'b':'k'});fixR();
const RW0=[{id:'r1',t:'Uitje naar de speeltuin',c:20},{id:'r2',t:'Filmavond kiezen',c:15},{id:'r3',t:'Extra schermtijd',c:10}];
const gen=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const fixS=()=>{S.st=S.st||ST0.map(x=>({...x}));S.rw=S.rw||RW0.map(x=>({...x}));S.rq=S.rq||[];S.bg=S.bg||{};S.ic=S.ic||''};fixS();
const ric=async()=>{try{if(dref){const d=await dref.get();if(d.exists)return JSON.parse(d.data().s).ic||''}}catch(e){}return S.ic||''};
const hp=t=>{let h=5381;for(const c of 'gp'+t)h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)};
const MUT='addev delev addli tli clrli tch addch newweek wladd wldel ctadd ctdel addmb delmb tolist usest savest delst rqnew rqok rqno rwadd rwdel setpin bgset bgtx bgpay newcode avset avbg'.split(' ');
const cur=()=>M.find(m=>m.id===ME);
const isB=()=>{const x=cur();return (!!x&&x.r==='b')||!M.some(m=>m.r==='b')};
const isP=()=>{const x=cur();return !x||x.r==='b'||x.r==='o'};
const save=()=>{try{localStorage.setItem("gp1",JSON.stringify(S))}catch(e){}sync()};
const U={v:"vandaag",f:"all",d:T,l:"Boodschappen",nl:"",nf:{t:"",h:"",w:[]},nc:{t:"",w:"s",p:"2"},nm:{n:"",c:"#F28C28",r:"k"},nct:{n:'',r:'Klasgenoot',t:''},nw:{t:'',d:''},o:{},ns:{w:null},jc:'',pp:{},pn:{id:null,v:''},bt:{m:null,d:'',a:''},nr:{t:'',c:'10'}};try{U.jc=(location.hash||'').slice(1).toUpperCase().replace(/[^A-Z0-9]/g,'')}catch(e){}
const okW=w=>U.f==="all"||(Array.isArray(w)?w.includes(U.f):w===U.f);
const dots=w=>w.map(i=>`<i class="dot" style="background:${mem(i).c}"></i>`).join("");
const dn=d=>D(d).toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"});
const monday=d=>{const x=D(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const evs=d=>S.ev.filter(e=>e.d===d&&okW(e.w)).sort((a,b)=>(a.h||"").localeCompare(b.h||""));
const evRow=e=>`<div class="row"><div class="time">${e.h||"Hele dag"}</div><div class="grow"><b>${esc(e.t)}</b><div class="dots">${dots(e.w)}${cn(e.c)?`<span class="mute">met ${esc(cn(e.c))}</span>`:""}</div>${shareHtml(e)}</div><button class="x" data-a="delev" data-v="${e.id}" aria-label="Verwijder ${esc(e.t)}">×</button></div>`;
const chRow=c=>`<div class="row"><button class="ck ${c.x?"on":""}" data-a="tch" data-v="${c.id}" aria-label="Afvinken"></button><div class="grow ${c.x?"done":""}"><b>${esc(c.t)}</b><div class="dots">${dots([c.w])}<span class="mute">${mem(c.w).n}</span></div></div><span class="pts">${c.p} pt</span></div>`;

function note(k,t){
 S.nt.unshift({id:Date.now()+Math.random(),k,t,ts:Date.now(),r:0});S.nt=S.nt.slice(0,50);save();
 try{if("Notification" in window&&Notification.permission==="granted")new Notification("Gezinsplanner",{body:t})}catch(e){}
}
function bell(){
 const n=S.nt.filter(x=>!x.r).length;
 return `<button class="bellb" data-a="tab" data-v="meldingen" aria-label="Meldingen, ${n} nieuw"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6zM10 19a2 2 0 0 0 4 0"/></svg>${n?`<b class="badge">${n}</b>`:""}</button>`;
}
function head(title,sub){
 return `<div class="top"><div class="tt"><h1>${title}</h1>${bell()}</div>${sub?`<p class="sub">${sub}</p>`:""}</div>
 <div class="chips" role="group" aria-label="Filter op gezinslid"><button class="chip ${U.f==="all"?"on":""}" data-a="flt" data-v="all">Iedereen</button>${M.map(m=>`<button class="chip ${U.f===m.id?"on":""}" data-a="flt" data-v="${m.id}"><i class="dot" style="background:${m.c};margin:0"></i>${m.n}</button>`).join("")}</div>`;
}

function vVandaag(){
 const h=new Date().getHours(),g=h<12?"Goedemorgen":h<18?"Goedemiddag":"Goedenavond";
 const e=evs(T),c=S.ch.filter(c=>!c.x&&okW(c.w)).slice(0,4),m=S.me[T],b=S.li.Boodschappen.filter(i=>!i.x).length;
 return head(g,dn(T))+`
 <div class="card hc"><h2>Vandaag op de agenda</h2>${hq("v_agenda")}${e.length?e.map(evRow).join(""):`<div class="empty">Niets gepland. Plan iets in via Agenda.</div>`}</div>
 <div class="card hc"><h2>Nog te doen</h2>${hq("v_taken")}${c.length?c.map(chRow).join(""):`<div class="empty">Alle taken zijn gedaan.</div>`}</div>
 <div class="card hc"><h2>Vanavond eten</h2>${hq("v_eten")}${m&&m.n?`<b>${esc(m.n)}</b>`:`<div class="empty">Nog niets gekozen.</div>`}<div class="inline" style="margin-top:10px"><button class="btn ghost" data-a="tab" data-v="eten">Naar weekmenu</button><button class="btn ghost" data-a="tab" data-v="lijsten">${b} op boodschappenlijst</button></div></div>`;
}

function vAgenda(){
 const mo=monday(U.d),days=[0,1,2,3,4,5,6].map(i=>add(mo,i));
 const strip=days.map(d=>{const id=iso(d);return `<button class="wd ${id===U.d?"on":""}" data-a="day" data-v="${id}"><small>${d.toLocaleDateString("nl-NL",{weekday:"short"})}</small><b>${d.getDate()}</b>${evs(id).length?'<i class="pip"></i>':'<i class="pip" style="background:none"></i>'}</button>`}).join("");
 const e=evs(U.d);
 return head("Agenda",dn(U.d))+`
 <div class="card"><div class="week"><button class="x" data-a="wk" data-v="-7" aria-label="Vorige week">‹</button>${strip}<button class="x" data-a="wk" data-v="7" aria-label="Volgende week">›</button></div></div>
 <div class="card"><h2>${U.d===T?"Vandaag":"Deze dag"}</h2>${e.length?e.map(evRow).join(""):`<div class="empty">Geen afspraken. Voeg er hieronder een toe.</div>`}</div>
 <div class="card hc"><h2>Nieuwe afspraak</h2>${hq("a_nieuw")}<div class="form">
  <input data-k="nf.t" placeholder="Wat staat er op de planning?" value="${esc(U.nf.t)}" aria-label="Titel">
  <input data-k="nf.h" type="time" value="${U.nf.h}" aria-label="Tijd">
  <div class="chips" style="padding:0">${M.map(m=>`<button class="chip ${U.nf.w.includes(m.id)?"on":""}" data-a="nfw" data-v="${m.id}"><i class="dot" style="background:${m.c};margin:0"></i>${m.n}</button>`).join("")}</div>
  ${S.ct.length?`<p class="mute" style="margin:0">Met wie buiten het gezin?</p><div class="chips" style="padding:0">${S.ct.map(c=>`<button class="chip ${(U.nf.c||[]).includes(c.id)?"on":""}" data-a="nfc" data-v="${c.id}">${esc(c.n)}</button>`).join("")}</div>`:""}<button class="btn" data-a="addev">Plan in</button></div></div>`;
}

U.hp={};U.o.trof=true;U.sp='w';
